services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mktly}
      MYSQL_USER: ${DB_USERNAME:-mktly}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mktly_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1125}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8125}:8025"

  app:
    build: ./backend
    working_dir: /var/www/html/public
    command: php -S 0.0.0.0:8000 -t . ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AI_SERVICE_URL: http://ai:8001
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "${APP_HOST_PORT:-8100}:8000"
    volumes:
      - ./backend:/var/www/html
      - app_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build: ./ai
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-dev-internal-token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${AI_HOST_PORT:-8101}:8001"
    volumes:
      - ./ai:/app

volumes:
  mysql_data:
  app_vendor:
